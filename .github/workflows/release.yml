name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run cap:sync

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CARGA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CARGA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARGA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export CARGA_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            echo "::warning::no keystore in secrets, APK signed with a throwaway debug key"
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
          fi
          (cd android && ./gradlew assembleRelease --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/carga-$GITHUB_REF_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--generate-notes"
          NOTES=""
          if [ "$SIGNED_WITH" = "debug" ] || [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            FLAGS="$FLAGS --prerelease"
          fi
          if [ "$SIGNED_WITH" = "debug" ]; then
            NOTES="Test build signed with a throwaway debug key: the next release will not install over it without uninstalling first (export your backup before)."
          fi
          APK="$RUNNER_TEMP/carga-$GITHUB_REF_NAME.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Carga $GITHUB_REF_NAME" --notes "$NOTES" $FLAGS
          fi
